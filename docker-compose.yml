services:
  backend:
    build:
      context: ./backend
    environment:
      JITENDEX_URL: https://github.com/stephenmk/stephenmk.github.io/releases/latest/download/jitendex-yomitan.zip
      DICTIONARY_DB_PATH: /data/jitendex.sqlite
      PORT: "4001"
      ALLOW_REINDEX: "false"
    volumes:
      - dictionary-data:/data
    ports:
      - "4001:4001"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      VITE_DICTIONARY_PROXY_TARGET: http://backend:4001
      VITE_ALLOW_DICTIONARY_REINDEX: "false"
    ports:
      - "4000:4000"

volumes:
  dictionary-data:
